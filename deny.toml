# Politique des dépendances (cargo-deny) : licences permissives ou MPL-2.0 (godot-rust),
# compatibles avec la double licence MIT OR Apache-2.0 du plugin.
[licenses]
allow = ["MIT", "Apache-2.0", "MPL-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
